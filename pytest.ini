[pytest]
testpaths = tests
addopts = -v --tb=short --alluredir=reports/allure_results --html=reports/html/report.html --self-contained-html
asyncio_mode = auto
markers =
    api: API tests
    ui: UI tests
    db: Database tests
    mobile: Mobile tests
    performance: Performance tests
    security: Security tests
    smoke: Smoke tests
    regression: Regression tests
    flaky: Flaky tests with retries
